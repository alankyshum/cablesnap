appId: com.persoack.cablesnap
---
- launchApp:
    clearState: true

# Welcome screen.
# `clearState: true` forces a full cold start, so the app holds a blank frame
# (app/_layout.tsx returns null while !ready) through useAppInit's async DB
# open + migrations + onboarded-state read before it can render and redirect to
# /onboarding/welcome. A bare assertVisible races that cold-start on a CI
# emulator under load (BLD-1742: it failed after the default retry window).
# extendedWaitUntil with an explicit timeout absorbs the first-paint latency
# without masking a genuinely-broken launch. `visible` + `timeout` (ms) is a
# stable Maestro 1.39.0 command (ExtendedWaitUntilCommand). The subtitle copy
# below must match app/onboarding/welcome.tsx exactly (text is regex-matched by
# default in 1.39.0, and the prior "& macro tracker" string did not match).
# Timeout raised to 90000ms (BLD-1754): the prior 60s was not enough — the
# CI run took 64s (just over the 60s limit). Emulator cold-start on a loaded
# ubuntu-latest swiftshader runner after a native Gradle build can exceed 60s.
# 90s gives a comfortable margin while still catching a genuinely-broken launch
# (the step itself has a 45-min hard cap).
- extendedWaitUntil:
    visible: "Welcome to CableSnap"
    timeout: 90000
- assertVisible: "Your free workout tracker, optimized for cable machines"
- tapOn: "Get Started"

# Setup screen — preferences
- assertVisible: "Set Up Your Preferences"
- assertVisible: "Weight Unit"
- tapOn: "kg"
- assertVisible: "Measurement Unit"
- tapOn: "cm"

# Select experience level.
# The level cards and the Continue button live in a scrollable FlatList
# (app/onboarding/setup.tsx): the cards are `data`, the Continue button is the
# `ListFooterComponent`. On the CI emulator viewport only the Beginner +
# Intermediate cards fit above the fold, so the footer button is NOT in the
# rendered/virtualized hierarchy at this point — a bare `tapOn: "Continue"`
# reported "Element not found: Text matching regex: Continue" even though the
# Beginner radio WAS selected (BLD-1757: the failure-point screenshot + a11y
# hierarchy from run 27999879078 confirmed Beginner checked, Continue off-screen).
- assertVisible: "Experience Level"
- tapOn: "Beginner"
- assertVisible: "I'm just getting started with gym workouts"
# Scroll the footer into view before tapping. We target the button's ENABLED
# accessible name ("Continue to recommendations" — its accessibilityLabel is
# `level ? "Continue to recommendations" : "Select an experience level to
# continue"`), which only exists once a level is selected. This both brings the
# below-the-fold footer on-screen AND implicitly re-asserts the radio registered;
# if selection had silently failed, the enabled name would never appear and this
# step fails fast with a clear message instead of a generic "Continue" miss.
# `scrollUntilVisible` (element/direction/timeout) is a stable Maestro 1.39.0
# command (YamlScrollUntilVisible). NOTE: unlike extendedWaitUntil (whose timeout
# is milliseconds), scrollUntilVisible's `timeout` is in SECONDS — the orchestra
# multiplies it by 1000 (ScrollUntilVisibleCommand.timeoutToMillis). 20s (the
# command default) is ample to scroll a 3-item list to its footer.
- scrollUntilVisible:
    element: "Continue to recommendations"
    direction: DOWN
    timeout: 20
- tapOn: "Continue to recommendations"

# Recommend screen
- assertVisible: "We Recommend"
- assertVisible: "Recommended"
- tapOn:
    text: "I'll explore on my own"

# Should land on main Workouts tab
- assertVisible: "Workouts"
- assertVisible: "Quick Start"
