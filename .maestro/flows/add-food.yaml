appId: com.persoack.cablesnap
---
- launchApp

# Navigate to Nutrition tab
- tapOn: "Nutrition"
- assertVisible: "Today"

# Open the Add Food sheet. The affordance is the Nutrition header button
# (accessibilityLabel "Add food", app/(tabs)/_layout.tsx:63) — there is no
# "add-food-fab" testID. It opens a BottomSheet titled "Add Food" whose body
# is <InlineFoodSearch>.
- tapOn: "Add food"
- assertVisible: "Add Food"

# Select meal type FIRST while the MealFavoritesBar chips are at the top of
# the sheet and fully visible (before expanding the manual form scrolls the
# view down). "Lunch" is the chip label (MealFavoritesBar / MEAL_LABELS.lunch).
# The chip has accessibilityLabel "Meal: Lunch" but tapOn matches rendered text.
- tapOn: "Lunch"

# Reveal the manual-entry form. InlineFoodSearch shows search + meal chips by
# default; the Food name / macro inputs live inside ManualFoodEntry, which is
# collapsed until "Manual Entry" is tapped (ManualFoodEntry.tsx:25).
- tapOn: "Manual Entry"
- assertVisible: "Manual Food Entry"

# --- Fill the form by testID, NOT by visible label text. ---
#
# Why id-based selectors here (BLD-1793): the macro inputs (Protein/Carbs/Fat)
# render in a flexDirection:row at flex:1 each, so on the 320px CI emulator each
# is ~100px wide and the floating label wraps onto two lines ("Prot\nein (g)").
# Tapping the wrapped LABEL text (tapOn: "Protein (g)") landed on the label
# geometry, not the input's editable region — focus never moved, so the macro
# inputText values bled into the still-focused Calories field
# (run 28012401877: Calories read "1653103.6" = 165+31+0+3.6 concatenated).
# testIDs land directly on the <TextInput> nodes (Input spreads {...props})
# and a tap on a TextInput natively focuses it — deterministic regardless of
# label wrapping or viewport.
# hideKeyboard between fields keeps lower fields/the submit button reachable
# (the soft keyboard otherwise covers the bottom half of the BottomSheet).

- tapOn:
    id: "food-name-input"
- inputText: "Chicken Breast"
- hideKeyboard

- scrollUntilVisible:
    element:
      id: "food-calories-input"
    direction: DOWN
    timeout: 20
- tapOn:
    id: "food-calories-input"
- inputText: "165"
- hideKeyboard

- scrollUntilVisible:
    element:
      id: "macro-protein-input"
    direction: DOWN
    timeout: 20
- tapOn:
    id: "macro-protein-input"
- inputText: "31"
- hideKeyboard

- tapOn:
    id: "macro-carbs-input"
- inputText: "0"
- hideKeyboard

- tapOn:
    id: "macro-fat-input"
- inputText: "3.6"
- hideKeyboard

# Log the food. The "Log Food" Button (testID "log-food-button",
# ManualFoodEntry.tsx) sits at the bottom of the expanded form, below
# the macro row + serving size input + "Save as favorite" chip.
#
# Selector: tap by testID "log-food-button", NOT by the visible text "Log Food"
# (BLD-1793 run 28020728191: "Element not found: Text matching regex: Log Food").
# The Button is rendered with accessibilityLabel="Log manual entry"
# (ManualFoodEntry.tsx) and Button spreads {...props} onto its Pressable
# (components/ui/button.tsx), so React Native exposes the Pressable's a11y
# content-desc as "Log manual entry" and COLLAPSES the child <Text>Log Food</Text>
# out of the UIAutomator2 tree Maestro reads — the visible "Log Food" label is
# not matchable by text, only the testID lands.
#
# Scrolling: use scrollUntilVisible, NOT a fixed number of `swipe` gestures
# (BLD-1793 run 28024333368: "Element not found: Id matching regex: log-food-button").
# The captured view hierarchy at that failure showed two swipe(UP) gestures left
# the Serving-size input at bounds [34,601][286,640] — i.e. exactly at the 640px
# screen bottom — so the Log Food button (one Button-height lower, ~y=648+) was
# still below the fold and not rendered into the tree (RN only materialises the
# ScrollView's visible window). A hardcoded swipe count is fragile to row heights.
# scrollUntilVisible drives the BottomSheet's REAL native android.widget.ScrollView
# (components/ui/bottom-sheet.tsx:99 — a plain RN <ScrollView>, confirmed present
# and scrollable:true in that same hierarchy dump at bounds [0,146][320,640]) and
# stops the moment the button enters the tree, regardless of exact row geometry.
# direction: DOWN scrolls content upward to reveal elements below the fold (same
# convention already used for the calories/protein inputs above). We do NOT pass
# centerElement (default false): Log Food is the LAST element in the form, so once
# it is on-screen there is nothing below it to scroll further — asking Maestro to
# center it could exhaust the scroll and report not-found. Default behaviour stops
# the instant the button is visible, which is all `tapOn` by id needs. NOTE:
# scrollUntilVisible `timeout` is in MILLISECONDS (Maestro 1.39.0) — 30000 = 30s.
- scrollUntilVisible:
    element:
      id: "log-food-button"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "log-food-button"

# Confirm the log succeeded. We do NOT assert "Nutrition" here: the Add Food sheet
# is a React Native <Modal> (components/ui/bottom-sheet.tsx) that stays OPEN after
# a manual log (nutrition.tsx only closes it on a user gesture), and a Modal
# occludes the screen beneath it in the UIAutomator2 tree — the captured hierarchy
# from run 28024333368 contained NO "Nutrition" node while the sheet was open, so
# that assertion would fail even on a successful save. Instead assert the form
# collapsed: useManualFoodForm.handleSave calls setExpanded(false) ONLY when
# onSave resolves true, which flips the toggle button's label from "Cancel" back
# to "Manual Entry" (ManualFoodEntry.tsx). Seeing "Manual Entry" again is a
# deterministic, in-sheet signal that the food was logged. assertVisible polls
# with its default wait, covering the async save round-trip.
- assertVisible: "Manual Entry"
