appId: com.persoack.cablesnap
---
- launchApp

# Navigate to Nutrition tab
- tapOn: "Nutrition"
- assertVisible: "Today"

# Open the Add Food sheet. The affordance is the Nutrition header button
# (accessibilityLabel "Add food", app/(tabs)/_layout.tsx:63) — there is no
# "add-food-fab" testID. It opens a BottomSheet titled "Add Food" whose body
# is <InlineFoodSearch>.
- tapOn: "Add food"
- assertVisible: "Add Food"

# Select meal type FIRST while the MealFavoritesBar chips are at the top of
# the sheet and fully visible (before expanding the manual form scrolls the
# view down). "Lunch" is the chip label (MealFavoritesBar / MEAL_LABELS.lunch).
# The chip has accessibilityLabel "Meal: Lunch" but tapOn matches rendered text.
- tapOn: "Lunch"

# Reveal the manual-entry form. InlineFoodSearch shows search + meal chips by
# default; the Food name / macro inputs live inside ManualFoodEntry, which is
# collapsed until "Manual Entry" is tapped (ManualFoodEntry.tsx:25).
- tapOn: "Manual Entry"
- assertVisible: "Manual Food Entry"

# Fill in food details (labels from ManualFoodEntry/MacroInputRow).
# After each inputText the soft keyboard stays open and covers the lower
# portion of the BottomSheet (confirmed by a11y hierarchy in run 28003172449:
# keyboard at [0,394][320,640] — the Calories field was below the fold /
# outside the a11y tree). hideKeyboard dismisses the keyboard between fields
# so subsequent tapOn/assertVisible targets are reachable.
- tapOn: "Food name"
- inputText: "Chicken Breast"
- hideKeyboard

# Scroll Calories into view in case the BottomSheet needs to reflow after
# keyboard dismissal, then tap it.
- scrollUntilVisible:
    element: "Calories"
    direction: DOWN
    timeout: 20
- tapOn: "Calories"
- inputText: "165"
- hideKeyboard

# MacroInputRow (Protein/Carbs/Fat) is the next row below Calories, but it
# may be below the fold after the keyboard dismissal animation. Scroll it into
# view before tapping each field. Parens in "Protein (g)" are regex
# metacharacters in Maestro 1.39.0 — escape them with \\ in YAML (which
# produces a single backslash for the regex engine, matching literal parens).
# scrollUntilVisible element is also regex-matched, so escape parens there too.
- scrollUntilVisible:
    element: "Protein \\(g\\)"
    direction: DOWN
    timeout: 20
- tapOn:
    text: "Protein \\(g\\)"
- inputText: "31"
- hideKeyboard

- tapOn:
    text: "Carbs \\(g\\)"
- inputText: "0"
- hideKeyboard

- tapOn:
    text: "Fat \\(g\\)"
- inputText: "3.6"
- hideKeyboard

# Log the food (button text "Log Food", ManualFoodEntry.tsx:37). The button is
# at the bottom of the expanded form — scroll it into view after filling the
# macro fields before tapping.
- scrollUntilVisible:
    element: "Log Food"
    direction: DOWN
    timeout: 20
- tapOn: "Log Food"

# Should return to the nutrition screen
- assertVisible: "Nutrition"
