appId: com.persoack.cablesnap
---
- launchApp

# Start a quick workout. "Quick Workout" is the session name but it renders ONLY
# as the React Navigation native header title (app/session/[id].tsx:537), which
# Maestro cannot match on Android (native toolbar text is outside the matchable
# view hierarchy — run 28036326519 failed here: "Assertion is false: 'Quick
# Workout' is visible"). Assert on "Add Exercise" instead: it is a real RN
# <Text>/Button node in the session footer (SessionListFooter.tsx:26) and proves
# the active-session screen loaded before we interact with it.
- tapOn: "Quick Start"
- assertVisible: "Add Exercise"

# Add an exercise to the session
- tapOn: "Add Exercise"
- assertVisible: "Search exercises"

# Search for a seeded exercise and select it. "Barbell Bench Press" is not a
# seeded exercise (only in test fixtures). "Bench Fly" is a real seed
# (lib/seed.ts:278), exact and unambiguous.
- tapOn: "Search exercises"
- inputText: "Bench Fly"

# Wait for the result row to render BEFORE tapping it (BLD-1793, run
# 28038846883: "Element not found: Text matching regex: Bench Fly"). The
# ExercisePickerSheet loads its rows via an async getAllExercises() DB read
# (components/ExercisePickerSheet.tsx:71) that fires while the sheet springs
# open from SCREEN_H*0.45. The filter is synchronous (onChangeText={setQuery},
# no debounce), but `exercises` is empty until that query resolves, so the
# default tap-retry window can elapse with the list still showing
# "No exercises found". extendedWaitUntil absorbs the DB-load + open-animation
# latency without masking a genuinely-empty result. `visible` + `timeout` (ms)
# is a stable Maestro 1.39.0 command; 30s mirrors the cold-start margins used
# in onboarding.yaml. The picker renders item.name as a plain <Text> node
# (ExercisePickerSheet.tsx:194), so this matches the same text the tap targets.
- extendedWaitUntil:
    visible: "Bench Fly"
    timeout: 30000
- tapOn: "Bench Fly"

# Back on session screen with the exercise added.
# The weight column header is "KG" for kg users (ExerciseGroupSetTable.tsx:78),
# not "WEIGHT" (which was never a real header).
#
# Wait for the session screen to settle after the picker dismisses (BLD-1793,
# run 28040824464: "Assertion is false: 'Bench Fly' is visible"). After tapOn
# the picker row, ExercisePickerSheet animates closed (withTiming 200ms) and
# the session screen re-renders with the new exercise group. A bare assertVisible
# races this dismiss + render cycle and can fail before Bench Fly is in the
# layout tree. extendedWaitUntil absorbs the dismiss animation latency without
# masking a genuinely-broken pick. 5s is generous relative to the 200ms
# animation but tight enough to catch a real failure.
- extendedWaitUntil:
    visible: "Bench Fly"
    timeout: 5000
- assertVisible: "SET"
- assertVisible: "KG"
- assertVisible: "REPS"

# Fill in set 1 weight. No "set-1-weight" testID exists. Inputs are identified
# by accessibilityLabel (SetRow.tsx:271-272): "Set 1 weight, <value> kilograms"
# and "Set 1 reps, <value>". Maestro text: is regex-matched so the prefix
# "Set 1 weight" matches the full runtime label.
# hideKeyboard after inputText: soft keyboard stays open on the emulator and
# can obscure the "Set 1 reps" field (same below-fold pattern as add-food,
# confirmed by run 28003172449 hierarchy).
- tapOn:
    text: "Set 1 weight"
- inputText: "60"
- hideKeyboard

# Fill in set 1 reps
- tapOn:
    text: "Set 1 reps"
- inputText: "10"
- hideKeyboard

# Cancel the workout to clean up. The "Discard Workout?" dialog's confirm button
# is "Delete" — confirmAction with destructive=true defaults to "Delete"
# (lib/confirm.ts:25), not "Discard" (hooks/useSessionActions.ts:1242-1252).
- tapOn: "Cancel Workout"
- assertVisible: "Discard Workout?"
- tapOn: "Delete"
