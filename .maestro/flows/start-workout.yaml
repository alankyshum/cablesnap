appId: com.persoack.cablesnap
---
- launchApp

# Workouts tab should be visible
- assertVisible: "Workouts"

# Start a quick workout
- tapOn: "Quick Start"

# Active session screen. Do NOT assert the session name "Quick Workout": it
# renders ONLY as the React Navigation native header title
# (app/session/[id].tsx:537), which Maestro cannot match on Android (native
# toolbar text is outside the matchable view hierarchy). The three buttons below
# are real RN nodes in the session footer (SessionListFooter.tsx) and fully
# prove the active-session screen rendered.
- assertVisible: "Add Exercise"
- assertVisible: "Finish Workout"
- assertVisible: "Cancel Workout"

# Cancel the workout to clean up. The "Discard Workout?" dialog's confirm button
# is "Delete" — confirmAction with destructive=true defaults to "Delete"
# (lib/confirm.ts:25), not "Discard" (hooks/useSessionActions.ts:1242-1252).
- tapOn: "Cancel Workout"
- assertVisible: "Discard Workout?"
- tapOn: "Delete"
