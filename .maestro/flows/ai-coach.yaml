appId: com.persoack.cablesnap
---
# Onboarding's clearState launch leaves the CI emulator without an API key.
# Save a format-valid synthetic key through the real settings UI. The four
# chunks make its known non-secret test data explicit without resembling a
# real credential, and CI sends no AI completion request.
- launchApp
- tapOn: "AI Coach"
- extendedWaitUntil:
    visible: "API Key Required"
    timeout: 30000
- tapOn:
    id: "coach-add-key"
- extendedWaitUntil:
    visible:
      id: "openrouter-key-input"
    timeout: 30000
- tapOn:
    id: "openrouter-key-input"
- inputText: "sk-or-v1-"
- inputText: "aaaaaaaaaaaaaaaa"
- inputText: "aaaaaaaaaaaaaaaa"
- inputText: "aaaaaaaaaaaaaaaa"
- inputText: "aaaaaaaaaaaaaaaa"
- hideKeyboard
- tapOn:
    id: "save-openrouter-key"
- extendedWaitUntil:
    visible: "Saved securely on this device"
    timeout: 30000
# The prior query has cached the empty state. Relaunch to initialize the
# status query against the saved local key before testing the composer.
- stopApp
- launchApp
- tapOn: "AI Coach"
- extendedWaitUntil:
    visible:
      id: "coach-model-picker"
    timeout: 30000
- tapOn:
    id: "coach-model-picker"
- extendedWaitUntil:
    visible:
      id: "model-catalog-list"
    timeout: 30000
# Native-only gesture regression. Option 9 starts outside the viewport on both
# phone portrait and tablet landscape. Swipe from the registered Gorhom list so
# this exercises RNGH touch coordination rather than DOM scrolling or adb input.
- assertNotVisible:
    id: model-catalog-option-9
- swipe:
    from:
      id: model-catalog-list
    direction: UP
- assertVisible:
    id: model-catalog-option-9
- tapOn:
    id: model-catalog-option-9
- extendedWaitUntil:
    notVisible:
      id: "model-catalog-list"
    timeout: 30000
- assertVisible: "Active Model: .*"
# The exact prompt assertion is the regression: it only appears when the
# stored key and selected model make the native composer usable.
- assertVisible: "Ask your AI Coach anything..."
- tapOn:
    id: "coach-composer"
- inputText: "How did my last workout go?"
- assertVisible: "How did my last workout go?"
