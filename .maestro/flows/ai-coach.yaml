appId: com.persoack.cablesnap
---
# Secret-free regression flow. The CI release APK starts with a clean
# SecureStore and intentionally receives no OpenRouter key, so its native
# contract is the configuration gate rather than an authenticated chat.
# Authenticated model selection and streaming are covered by unit tests.
- launchApp
- tapOn: "AI Coach"
- extendedWaitUntil:
    visible: "API Key Required"
    timeout: 90000
- assertVisible: "Add your OpenRouter key to chat..."
