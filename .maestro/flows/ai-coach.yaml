# Native-only regression flow. CI intentionally runs without third-party
# credentials, so exercise the model-picker gesture and the missing-key guard
# without issuing a network request. Never put an OpenRouter key in this repo.
appId: com.persoack.cablesnap
---
- launchApp
- tapOn: "AI Coach"
- extendedWaitUntil:
    visible: "AI Coach"
    timeout: 90000
- extendedWaitUntil:
    visible: "API Key Required"
    timeout: 30000
# The clean CI install has no saved model. The alternation also keeps this flow
# runnable on an emulator that already has a model selected.
- extendedWaitUntil:
    visible: "Select AI Model|Active Model: .*"
    timeout: 30000
- tapOn: "Select AI Model|Active Model: .*"
- extendedWaitUntil:
    visible: "Select AI Model"
    timeout: 30000
# Native-only gesture regression. Option 9 starts outside the viewport on both
# phone portrait and tablet landscape. Swipe from the registered Gorhom list so
# this exercises RNGH touch coordination rather than DOM scrolling or adb input.
- assertNotVisible:
    id: model-catalog-option-9
- swipe:
    from:
      id: model-catalog-list
    direction: UP
- assertVisible:
    id: model-catalog-option-9
- tapOn:
    id: model-catalog-option-9
- extendedWaitUntil:
    notVisible: "Select AI Model"
    timeout: 30000
- assertVisible: "Active Model: .*"
- assertVisible: "API Key Required"
# The composer remains guarded until the user supplies a key; do not attempt a
# real request or depend on a CI secret.
- assertVisible: "Add your OpenRouter key to chat..."
# Kill and relaunch after the guarded interaction. This verifies a clean native
# remount without requiring credentials or being blocked by a network request.
- stopApp
- launchApp
- tapOn: "AI Coach"
- extendedWaitUntil:
    visible: "API Key Required"
    timeout: 30000
