appId: com.persoack.cablesnap
---
# CI intentionally has no OpenRouter key. Onboarding runs first with
# clearState: true, so this flow verifies the native missing-key recovery
# rather than relying on a manually configured emulator.
- launchApp
- tapOn: "AI Coach"
- extendedWaitUntil:
    visible: "API Key Required"
    timeout: 90000
- assertVisible: "Add your OpenRouter key in Settings to chat with AI Coach and receive personalized workout insights."
- assertVisible: "Add your OpenRouter key to chat..."
- tapOn:
    id: "coach-add-api-key"
- extendedWaitUntil:
    visible:
      id: "openrouter-key-input"
    timeout: 30000
- assertVisible: "Connect OpenRouter"
