flows:
  - flows/onboarding.yaml
  - flows/add-food.yaml
  - flows/log-set.yaml
  - flows/start-workout.yaml
  - flows/view-progress.yaml

# The CI gate runs exactly the five credential-free regression flows. The
# native-only ai-coach.yaml scenario requires a valid OpenRouter key, and CI is
# deliberately secret-free; running it there asserts the intentional
# key-required placeholder rather than a usable composer. It remains available
# for credentialed native testing outside this gate.
#
# Maestro does NOT reset app state between flows in a `maestro test <dir>` run.
# Only onboarding.yaml does `launchApp: { clearState: true }` and walks through
# onboarding; the four leaf flows use a bare `launchApp` and assume the app is
# already past onboarding. Without a fixed order, a leaf flow can run first on
# a fresh install and land on the Welcome screen.
#
# `executionOrder.flowsOrder` (supported since well before the pinned Maestro
# 1.39.0 — see WorkspaceConfig.ExecutionOrder) runs the named flows first, in
# this exact sequence. We put onboarding first so it clears state and leaves
# the app on the main tabs; the four leaf flows then run against that established
# state. Names are the flow file stems (these flows set no `name:`).
# continueOnFailure:false makes onboarding a hard prerequisite — if it fails
# there is no point cascading the dependent flows, and the gate fails fast and
# deterministically.
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - onboarding
    - add-food
    - log-set
    - start-workout
    - view-progress
