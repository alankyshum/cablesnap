flows:
  - flows/onboarding.yaml
  - flows/add-food.yaml
  - flows/log-set.yaml
  - flows/start-workout.yaml
  - flows/view-progress.yaml

# The CI regression gate runs only the five hermetic flows above. ai-coach.yaml
# intentionally remains available for manually provisioned native testing; it
# requires a user-supplied OpenRouter key and cannot run in this secret-free job.
#
# Maestro runs selected flows in a NON-deterministic order by default and does
# NOT reset app state between a `maestro test <dir>` run. These flows are not
# self-contained: only onboarding.yaml does `launchApp: { clearState: true }`
# and walks through onboarding; the other four assume the app is already past
# onboarding. `executionOrder.flowsOrder` runs them in this exact sequence, so
# onboarding establishes state before the dependent leaf flows. The names are
# flow file stems (these flows set no `name:`). continueOnFailure:false makes
# onboarding a hard prerequisite, so the gate fails fast without cascading.
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - onboarding
    - add-food
    - log-set
    - start-workout
    - view-progress
