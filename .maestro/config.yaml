flows:
  # The CI gate is secret-free; AI Coach requires an OpenRouter key and is run manually when provisioned.
  - flows/onboarding.yaml
  - flows/add-food.yaml
  - flows/log-set.yaml
  - flows/start-workout.yaml
  - flows/view-progress.yaml

# Deterministic flow order for the CI regression gate (BLD-1735).
#
# Maestro does not reset app state between flows in a `maestro test <dir>` run.
# These five flows are not self-contained: only onboarding.yaml does
# `launchApp: { clearState: true }` and walks through onboarding; the other four
# use a bare `launchApp` and assume the app is already past onboarding (e.g.
# add-food taps "Nutrition", start-workout asserts "Workouts"). Without a fixed
# order the gate is flaky — if a leaf flow runs first on the fresh install it
# lands on the Welcome screen and fails.
#
# `executionOrder.flowsOrder` runs the named flow stems first, in this exact
# sequence, before any remaining flows. We put onboarding first so the four leaf
# flows run against that established state. `continueOnFailure: false` makes
# onboarding a hard prerequisite — if it fails there is no point cascading the
# dependent flows, and the gate fails fast and deterministically.
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - onboarding
    - add-food
    - log-set
    - start-workout
    - view-progress
