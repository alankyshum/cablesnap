name: Play AAB artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-play-aab:
    name: Build and verify signed Play AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate native project
        run: npx expo prebuild --clean --platform android

      - name: Configure production signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::$secret_name is empty — configure production signing secrets."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore
          {
            printf 'storeFile=release.keystore\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties
          chmod 600 android/keystore.properties android/app/release.keystore

      - name: Build Play release bundle
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon :app:bundleRelease
          cd ..
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify "$AAB" >/dev/null
          CERT=$(keytool -printcert -jarfile "$AAB" | awk -F': ' '/SHA256:/{gsub(/:/,"",$2); print toupper($2); exit}')
          EXPECTED=$(tr -d ':[:space:]' < fdroid/release-cert.sha256 | tr '[:lower:]' '[:upper:]')
          if [ -z "$CERT" ] || [ "$CERT" != "$EXPECTED" ]; then
            echo "::error::AAB signer fingerprint does not match the committed production certificate."
            exit 1
          fi
          echo "Verified production signing certificate fingerprint: $CERT"
          mkdir -p artifacts
          cp "$AAB" artifacts/cablesnap-play.aab
          sha256sum artifacts/cablesnap-play.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: cablesnap-play-aab
          path: artifacts/cablesnap-play.aab
          if-no-files-found: error
          retention-days: 14
