name: PR F-Droid AC10b Check

on:
  pull_request:
    paths:
      - 'plugins/with-wearos-module.js'
      - '.github/workflows/pr-fdroid-ac10b.yml'
      - '.github/workflows/scheduled-release.yml'
      - 'modules/expo-foss-barcode-scanner/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: {}

concurrency:
  group: pr-fdroid-ac10b-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-fdroid:
    name: Verify F-Droid APK GMS-free (AC10b)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate native project
        env:
          CABLESNAP_FDROID: "1"
          EXPO_NO_TELEMETRY: 1
        run: npx expo prebuild --clean --platform android

      - name: Diagnostic dump before F-Droid strip
        run: |
          echo "=== expo-notifications package.json version ==="
          cat node_modules/expo-notifications/package.json | grep '"version"' || true
          echo "=== expo-notifications build.gradle ==="
          cat node_modules/expo-notifications/android/build.gradle || true
          echo "=== expo-application package.json version ==="
          cat node_modules/expo-application/package.json | grep '"version"' || true
          echo "=== expo-camera package.json version ==="
          cat node_modules/expo-camera/package.json | grep '"version"' || true

      - name: Strip direct proprietary Expo dependencies
        env:
          CABLESNAP_FDROID: "1"
        run: |
          node - <<'NODE'
          const { patchFdroidExpoDependencies } = require('./plugins/with-wearos-module');
          patchFdroidExpoDependencies(process.cwd());
          NODE
          grep -nE 'compileOnly.*(firebase|installreferrer)|barcodeDependencyConfiguration' \
            node_modules/expo-notifications/android/build.gradle \
            node_modules/expo-application/android/build.gradle \
            node_modules/expo-camera/android/build.gradle || true

      - name: Boost Gradle JVM heap
        run: |
          set -euo pipefail
          PROPS=android/gradle.properties
          if grep -q '^org.gradle.jvmargs=' "$PROPS"; then
            sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m|' "$PROPS"
          else
            echo 'org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m' >> "$PROPS"
          fi
          grep '^org.gradle.jvmargs=' "$PROPS"

      - name: Build APK
        env:
          CABLESNAP_FDROID: "1"
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          set -euo pipefail
          cd android
          ./gradlew :app:assembleReleaseFdroid
          cd ..
          cp android/app/build/outputs/apk/releaseFdroid/app-releaseFdroid.apk cablesnap-fdroid.apk

      - name: AC10b — verify F-Droid APK contains no proprietary SUSS classes
        run: |
          set -euo pipefail
          TMPDIR_DEX=$(mktemp -d)
          trap 'rm -rf "$TMPDIR_DEX"' EXIT
          unzip -q -o cablesnap-fdroid.apk 'classes*.dex' -d "$TMPDIR_DEX"
          HITS=$(strings "$TMPDIR_DEX"/classes*.dex \
            | grep -oE 'com/google/firebase[A-Za-z0-9_$./-]*|com/google/mlkit[A-Za-z0-9_$./-]*|com/google/android/gms[A-Za-z0-9_$./-]*|com/android/installreferrer[A-Za-z0-9_$./-]*' \
            | sort -u || true)
          printf '%s\n' "$HITS"
          if [ -n "$HITS" ]; then
            echo "::error::AC10b violated — proprietary SUSS classes found in cablesnap-fdroid.apk:"
            printf '%s\n' "$HITS"
            exit 1
          fi
          echo "AC10b OK — F-Droid APK contains none of the four SUSS prefixes."
