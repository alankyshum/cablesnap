name: Play Internal AAB Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Play AAB artifact only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required signing secret $name is unavailable."
              exit 1
            fi
          done
          test -s fdroid/release-cert.sha256

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Generate Play Android project
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npx expo prebuild --clean --platform android

      - name: Configure Gradle memory
        run: |
          set -euo pipefail
          PROPS=android/gradle.properties
          if grep -q '^org.gradle.jvmargs=' "$PROPS"; then
            sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m|' "$PROPS"
          else
            echo 'org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m' >> "$PROPS"
          fi

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore
          cat > android/keystore.properties <<PROPS
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS
          chmod 600 android/keystore.properties android/app/release.keystore

      - name: Build release AAB
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          cd android
          test -s keystore.properties
          ./gradlew --no-daemon :app:bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab ../cablesnap-play-internal.aab

      - name: Verify signed bundle and identity
        run: |
          set -euo pipefail
          BUNDLE=cablesnap-play-internal.aab
          test -s "$BUNDLE"
          jarsigner -verify -certs "$BUNDLE" >/dev/null
          actual=$(keytool -printcert -jarfile "$BUNDLE" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')
          expected=$(head -1 fdroid/release-cert.sha256 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::AAB signing certificate does not match the committed release fingerprint."
            exit 1
          fi
          echo "Verified package com.persoack.cablesnap release signer."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cablesnap-play-internal-aab
          path: cablesnap-play-internal.aab
          if-no-files-found: error
          retention-days: 7
