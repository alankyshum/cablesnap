name: Update F-Droid Repo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.15.1)'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fdroid-release
  cancel-in-progress: false

jobs:
  update-fdroid:
    name: Update F-Droid Repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Verify signing migration marker and README
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          try:
              boundary = json.loads(Path("fdroid/signing-migration.json").read_text())["boundaryTag"]
          except (FileNotFoundError, json.JSONDecodeError, KeyError, TypeError) as exc:
              print(f"::error::Signing migration marker is missing or unparseable: {exc}", file=sys.stderr)
              raise SystemExit(1)
          readme = Path("README.md").read_text()
          start = "<!-- SIGNING_MIGRATION_NOTICE_START -->"
          end = "<!-- SIGNING_MIGRATION_NOTICE_END -->"
          pending = "boundary release pending — see release notes"
          valid_boundary = boundary is None or (isinstance(boundary, str) and re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", boundary))
          if not valid_boundary:
              print("::error::Signing migration marker boundaryTag is invalid; expected null or a release tag like v0.27.0.", file=sys.stderr)
              raise SystemExit(1)
          boundary_in_readme = pending if boundary is None else boundary
          if readme.count(start) != 1 or readme.count(end) != 1 or readme.count(boundary_in_readme) != 1:
              print("::error::README signing migration notice is out of sync with fdroid/signing-migration.json.", file=sys.stderr)
              raise SystemExit(1)
          print(f"Signing migration boundary verified: {boundary or 'pending'}")
          PY

      - name: Download F-Droid APK from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          echo "Downloading production-signed cablesnap.apk from release $TAG..."
          gh release download "$TAG" --pattern "cablesnap.apk" --output cablesnap.apk
          ls -la cablesnap.apk

      - name: Verify APK signature matches committed fingerprint
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is not set; the runner must provide the Android SDK for signature verification."
            exit 1
          fi
          if [ ! -d "$ANDROID_HOME/build-tools" ]; then
            echo "::error::Android SDK build-tools directory is missing under $ANDROID_HOME; cannot verify the APK signature."
            exit 1
          fi
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "::error::No Android build-tools found under $ANDROID_HOME/build-tools."
            exit 1
          fi
          APKSIGNER="${BUILD_TOOLS_DIR}apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner is unavailable at $APKSIGNER; the runner must provide Android build-tools."
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"

          if ! "$APKSIGNER" verify cablesnap.apk; then
            echo "::error::apksigner verify reports the APK signature is INVALID."
            exit 1
          fi

          "$APKSIGNER" verify --print-certs cablesnap.apk | tee apksigner.log
          ACTUAL_LIST=$(grep -oE 'certificate SHA-256 digest:[[:space:]]+[0-9a-fA-F:]+' apksigner.log \
              | sed -E 's/^certificate SHA-256 digest:[[:space:]]+//' \
              | tr -d ':[:blank:]' \
              | tr '[:lower:]' '[:upper:]' || true)
          if [ -z "$ACTUAL_LIST" ]; then
            echo "::error::Could not parse any SHA-256 certificate digest from apksigner output."
            exit 1
          fi
          UNIQUE_COUNT=$(echo "$ACTUAL_LIST" | sort -u | wc -l)
          if [ "$UNIQUE_COUNT" -ne 1 ]; then
            echo "::error::APK reports more than one distinct signer fingerprint — refusing to publish."
            echo "::error::Distinct SHA-256 values seen:"
            echo "$ACTUAL_LIST" | sort -u | sed 's/^/  /'
            exit 1
          fi
          ACTUAL_NORM=$(echo "$ACTUAL_LIST" | head -1)
          EXPECTED_NORM=$(head -1 fdroid/release-cert.sha256 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')

          if ! echo "$EXPECTED_NORM" | grep -qE '^[0-9A-F]{64}$'; then
            echo "::error::Expected fingerprint in fdroid/release-cert.sha256 is not a valid 64-char hex SHA-256."
            exit 1
          fi
          if ! echo "$ACTUAL_NORM" | grep -qE '^[0-9A-F]{64}$'; then
            echo "::error::Parsed signer fingerprint is not a valid 64-char hex SHA-256."
            exit 1
          fi

          echo "Expected SHA-256: $EXPECTED_NORM"
          echo "Actual   SHA-256: $ACTUAL_NORM"
          if [ "$ACTUAL_NORM" != "$EXPECTED_NORM" ]; then
            echo "::error::APK cert fingerprint does not match fdroid/release-cert.sha256."
            echo "::error::Either the wrong release asset was downloaded, or the signing key was rotated (requires a deliberate fingerprint update)."
            exit 1
          fi
          echo "Cert fingerprint verified: $ACTUAL_NORM"

      - name: Restore F-Droid keystore
        run: |
          echo "${{ secrets.FDROID_KEYSTORE }}" | base64 -d > fdroid/keystore.p12

      - name: Install fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv
          python3 -m venv /tmp/fdroid-venv
          /tmp/fdroid-venv/bin/pip install fdroidserver

      - name: Prepare F-Droid repo
        run: |
          cp cablesnap.apk fdroid/repo/
          rm -f fdroid/repo/.gitkeep
          cd fdroid
          /tmp/fdroid-venv/bin/fdroid update --create-metadata --rename-apks
        env:
          FDROID_KEY_STORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}

      - name: Clean up keystore
        if: always()
        run: rm -f fdroid/keystore.p12

      - uses: actions/upload-pages-artifact@v3
        with:
          path: fdroid

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: update-fdroid
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment-retry2.outputs.page_url || steps.deployment-retry1.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      # Attempt 1
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Back-off before retry 1 (~60 s) — only runs if attempt 1 failed
      - name: Back-off before retry 1
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::deploy-pages failed on attempt 1 — waiting 60 s before retry 1 of 2..."
          sleep 60

      # Attempt 2
      - id: deployment-retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Back-off before retry 2 (~120 s) — only runs if both prior attempts failed
      - name: Back-off before retry 2
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry1.outcome == 'failure'
        run: |
          echo "::warning::deploy-pages failed on attempt 2 — waiting 120 s before retry 2 of 2..."
          sleep 120

      # Attempt 3 (final) — no continue-on-error; job fails if this also fails
      - id: deployment-retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
