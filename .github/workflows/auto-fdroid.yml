name: Auto-trigger F-Droid update

on:
  release:
    types: [published]

permissions:
  actions: write

jobs:
  trigger-fdroid:
    name: Trigger F-Droid update if F-Droid APK uploaded
    runs-on: ubuntu-latest
    steps:
      - name: Check for F-Droid APK asset and trigger F-Droid pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The self-hosted F-Droid repo serves cablesnap.apk, the
          # production-signed Play-flavor phone APK. The separate
          # cablesnap-fdroid.apk asset remains the GMS-free build for users
          # of the official F-Droid listing.
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          echo "Release published: $TAG"

          PLAY_APK_EXISTS=$(gh api repos/${{ github.repository }}/releases/${{ github.event.release.id }}/assets \
            --jq '[.[] | select(.name == "cablesnap.apk")] | length')

          if [ "$PLAY_APK_EXISTS" -gt 0 ]; then
            echo "cablesnap.apk found in release $TAG, triggering F-Droid update..."
            gh workflow run fdroid-release.yml -f tag="$TAG" --repo ${{ github.repository }}
          else
            echo "No cablesnap.apk found in release $TAG, skipping F-Droid update."
          fi
