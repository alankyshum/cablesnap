name: F-Droid Recipe Build

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  recipe-build:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Build through fdroidserver scanner and recipe
        run: .fdroid-preflight/fdroid-preflight build --repo .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fdroid-recipe-apks
          path: .fdroid-preflight/work/unsigned/*.apk
          if-no-files-found: warn
