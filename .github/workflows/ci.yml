name: CI

# Runs typecheck (`tsc --noEmit`), lint (`eslint`), and unit tests (`jest`) on
# every PR and on pushes to `main`. Establishes the automated verification gate
# that was missing from the repo (BLD-742).
#
# Originally narrow per BLD-742 (no lint). BLD-2160 added the blocking `lint`
# job once the 29 pre-existing ESLint errors on `main` were fixed. Coverage,
# e2e, and matrix remain out of scope. Bundle Gate (`bundle-gate.yml`) runs
# independently.
#
# Job split rationale (Option C): typecheck and jest run as separate jobs so
# each result is independently reported in the PR status checks UI.
# Both jobs are blocking (no continue-on-error). See BLD-2161.
#
# jest: pre-existing failures (BLD-753: supersets, session-add-exercise,
# WorkoutHeatmap) were caused by harness pollution — jest was resolving test
# files from .paperclip/worktrees/ git worktrees. Fixed in BLD-2161 by adding
# .paperclip/worktrees/ to testPathIgnorePatterns in jest.config.js.

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

# Cancel in-progress runs on new commits to the same ref to save CI minutes.
# Mirrors the pattern in `bundle-gate.yml`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node version sourced from .nvmrc — single source of truth.
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        # `--legacy-peer-deps` matches `bundle-gate.yml` — known peer-dep
        # conflicts in the Expo / React Native dependency tree.
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # BLD-2160: blocking ESLint gate. Closes the hole where `react-hooks/*`
    # correctness errors accumulated on `main` because CI had no lint job
    # (lint-staged only checks locally-touched files). All 29 pre-existing
    # ESLint *errors* are now fixed, so this job runs blocking from day one
    # (no continue-on-error) — any newly-introduced error fails the PR.
    #
    # --max-warnings=17 ratchets the warning count at the 17 pre-existing
    # `warn`-level findings (complexity / max-lines-per-function /
    # no-restricted-syntax hardcoded-hex / one exhaustive-deps). Those are
    # explicitly Out of Scope for BLD-2160 (refactoring the oversized/complex
    # files is tracked separately) and are advisory by config in .eslintrc.js.
    # The ratchet still fails the build the moment a NEW warning is added, so
    # the debt can only shrink. Lower this number (toward 0) as the warnings
    # are burned down in their own tickets; do NOT raise it.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node version sourced from .nvmrc — single source of truth.
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint -- --max-warnings=17

  jest:
    name: Jest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Jest
        # `--ci` disables watch/snapshot-write; `--runInBand` keeps memory
        # usage predictable on the GitHub-hosted runner.
        run: npm test -- --ci --runInBand

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # BLD-2854: Coverage ratchet — enforce the coverageThreshold.global floor
    # defined in jest.config.js. Scoped to the same collectCoverageFrom set
    # (app/, lib/, components/) but run --runInBand (same as the jest job above)
    # and with NODE_OPTIONS to avoid OOM (per BLD-2482 memory-aware fix).
    # If this job OOMs or times out, narrow collectCoverageFrom in jest.config.js
    # to lib/+hooks/ (pure-logic dirs) and document the scope change here.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Coverage
        # --ci disables watch/snapshot-write; --runInBand keeps memory usage
        # predictable (mirrors jest job). --coverageReporters=text-summary
        # avoids writing html/lcov artifacts to disk (saves ~50 MB, speeds
        # up job). coverageThreshold enforcement is in jest.config.js — Jest
        # exits non-zero if any metric drops below its floor.
        run: npm run test:coverage -- --ci --runInBand --coverageReporters=text-summary
        env:
          NODE_OPTIONS: --experimental-sqlite

  android-lint:
    name: Backup XML validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # BLD-1114: Verify backup XML rules (set-media/ include/exclude) are valid
    # and contain the expected entries. Runs expo prebuild to exercise the
    # with-form-clips-backup.js plugin, then validates the generated XML files
    # directly — no Gradle build required, avoiding the React Native JS bundle
    # dependency that would pull in Sentry (fails without auth in CI).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Expo prebuild (Android)
        run: npx expo prebuild --clean --platform android
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Validate backup XML (set-media rules)
        run: |
          # The with-form-clips-backup.js plugin generates two XML files:
          #   form_clips_data_extraction_rules.xml  — Android API >= 31
          #   form_clips_backup_rules.xml           — Android API < 31
          # Both must be well-formed XML and contain set-media/ exclusion rules.

          DATA_XML=android/app/src/main/res/xml/form_clips_data_extraction_rules.xml
          BACKUP_XML=android/app/src/main/res/xml/form_clips_backup_rules.xml

          for f in "$DATA_XML" "$BACKUP_XML"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing backup XML: $f"
              echo "Files found in android/app/src/main/res/xml/:"
              ls android/app/src/main/res/xml/ 2>/dev/null || echo "(directory missing)"
              exit 1
            fi
            # Validate XML syntax
            if ! xmllint --noout "$f" 2>&1; then
              echo "::error::Invalid XML syntax in $f"
              exit 1
            fi
            # Verify set-media/ exclusion is present
            if ! grep -q 'set-media/' "$f"; then
              echo "::error::set-media/ exclusion missing from $f"
              cat "$f"
              exit 1
            fi
            echo "✓ $f — well-formed XML with set-media/ exclusion"
          done
          echo "Backup XML gate passed."

      - name: Assert AndroidManifest references backup XMLs
        # BLD-1119: If the Expo plugin chain regresses and the manifest stops
        # referencing the backup XMLs, the set-media/ exclude rules silently
        # stop being applied. Fail fast with a precise diagnosis.
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml not found at $MANIFEST"
            exit 1
          fi
          if ! grep -qF 'android:dataExtractionRules="@xml/form_clips_data_extraction_rules"' "$MANIFEST"; then
            echo "::error::AndroidManifest is missing dataExtractionRules reference — check plugins/with-form-clips-backup.js"
            exit 1
          fi
          if ! grep -qF 'android:fullBackupContent="@xml/form_clips_backup_rules"' "$MANIFEST"; then
            echo "::error::AndroidManifest is missing fullBackupContent reference — check plugins/with-form-clips-backup.js"
            exit 1
          fi
          echo "✓ AndroidManifest references both backup XMLs."
