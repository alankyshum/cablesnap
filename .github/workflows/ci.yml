name: CI

# Runs typecheck (`tsc --noEmit`) and unit tests (`jest`) on every PR and on
# pushes to `main`. Establishes the automated verification gate that was
# missing from the repo (BLD-742).
#
# Scope intentionally narrow per BLD-742 spec: no lint, no coverage, no e2e,
# no matrix. Bundle Gate (`bundle-gate.yml`) continues to run independently.
#
# Job split rationale (Option C): typecheck and jest run as separate jobs so
# each can be independently marked non-blocking via `continue-on-error: true`
# until the pre-existing failures on `main` are cleaned up. Typecheck flipped
# back to blocking in BLD-764 once the pre-existing TS errors were cleared.
# - jest: 12 pre-existing test failures across 3 suites (supersets,
#   session-add-exercise, WorkoutHeatmap) → see BLD-753. Flips to blocking
#   once those failures are fixed.

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

# Cancel in-progress runs on new commits to the same ref to save CI minutes.
# Mirrors the pattern in `bundle-gate.yml`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned to match `bundle-gate.yml`. No `.nvmrc` or `engines` field
          # in the repo to source from. Bump in lockstep with the other CI.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # `--legacy-peer-deps` matches `bundle-gate.yml` — known peer-dep
        # conflicts in the Expo / React Native dependency tree.
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

  jest:
    name: Jest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # TODO(BLD-753): flip to blocking (remove `continue-on-error`) after the
    # 12 pre-existing test failures across 3 suites surfaced by this
    # workflow's first run are fixed (supersets, session-add-exercise,
    # WorkoutHeatmap). BLD-749 mock fix already landed; remaining failures
    # are real assertion mismatches against current UI behavior.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Jest
        # `--ci` disables watch/snapshot-write; `--runInBand` keeps memory
        # usage predictable on the GitHub-hosted runner.
        run: npm test -- --ci --runInBand

  android-lint:
    name: Backup XML validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # BLD-1114: Verify backup XML rules (set-media/ include/exclude) are valid
    # and contain the expected entries. Runs expo prebuild to exercise the
    # with-form-clips-backup.js plugin, then validates the generated XML files
    # directly — no Gradle build required, avoiding the React Native JS bundle
    # dependency that would pull in Sentry (fails without auth in CI).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install xmllint
        run: sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Expo prebuild (Android)
        run: npx expo prebuild --clean --platform android
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Validate backup XML (set-media rules)
        run: |
          # The with-form-clips-backup.js plugin generates two XML files:
          #   form_clips_data_extraction_rules.xml  — Android API >= 31
          #   form_clips_backup_rules.xml           — Android API < 31
          # Both must be well-formed XML and contain set-media/ exclusion rules.

          DATA_XML=android/app/src/main/res/xml/form_clips_data_extraction_rules.xml
          BACKUP_XML=android/app/src/main/res/xml/form_clips_backup_rules.xml

          for f in "$DATA_XML" "$BACKUP_XML"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing backup XML: $f"
              echo "Files found in android/app/src/main/res/xml/:"
              ls android/app/src/main/res/xml/ 2>/dev/null || echo "(directory missing)"
              exit 1
            fi
            # Validate XML syntax
            if ! xmllint --noout "$f" 2>&1; then
              echo "::error::Invalid XML syntax in $f"
              exit 1
            fi
            # Verify set-media/ exclusion is present
            if ! grep -q 'set-media/' "$f"; then
              echo "::error::set-media/ exclusion missing from $f"
              cat "$f"
              exit 1
            fi
            echo "✓ $f — well-formed XML with set-media/ exclusion"
          done
          echo "Backup XML gate passed."
