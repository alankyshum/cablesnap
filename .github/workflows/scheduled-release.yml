name: Scheduled Release

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      republish_current:
        description: >-
          Re-publish the current version already committed to main without
          bumping. Use for hotfix re-runs after a prior scheduled release
          built the wrong APK or failed mid-pipeline (e.g. lintVitalRelease
          regression). Reads version from package.json + versionCode from
          fdroid metadata and skips all bump/promote/commit steps. The
          release tag for that version MUST NOT already exist.
        type: boolean
        default: false

permissions:
  contents: write

# BLD-2316: serialize Scheduled Release runs so two never publish at once.
# Without this, the 12h `schedule` cron firing while a `workflow_dispatch` run
# is mid-flight (or two dispatches) lets both compute the SAME `NEXT` version
# from the same checkout-time `git tag` snapshot; the loser then dies at
# "Create GitHub Release" with "a release with the same tag name already
# exists" (run #28403940771 vs the concurrent run that shipped v0.26.47).
#
# `cancel-in-progress: false` is REQUIRED, not a default: a release run that has
# already built + signed + pushed a version-bump commit must NOT be killed
# mid-flight — that would leave a bumped CHANGELOG/version on main with no
# GitHub Release (a "ghost version", the exact failure class BLD-2139 fixed).
# Queue the second run behind the first instead. The group is a constant
# (NOT keyed on github.ref or run id) so every dispatch + cron run shares one
# lane — matching fdroid-release.yml, the repo's other release workflow.
concurrency:
  group: scheduled-release
  cancel-in-progress: false

jobs:
  release:
    name: Check, build & release
    runs-on: ubuntu-latest
    # BLD-2290: hard cap so a wedged QEMU cannot run without a bound. The two
    # isolated native builds need about 69 min end-to-end; 90 min leaves roughly
    # 30% headroom for runner variance while still bounding any hang.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_PAT }}

      # Android builds on ubuntu-latest routinely exhaust the ~14 GB of free
      # disk available on hosted runners (Gradle cache + node_modules +
      # generated native project + AVD = ~20 GB). Free up space before any
      # tooling is installed so the cleanup is maximally effective.
      # Run #25238424655 died with "No space left on device" mid-Gradle build.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false   # keep node/java tool cache; we use them
          android: false      # we need the Android SDK
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Verify release signing secrets are configured
        run: |
          MISSING=""
          [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && MISSING="$MISSING ANDROID_KEYSTORE_BASE64"
          [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && MISSING="$MISSING ANDROID_KEYSTORE_PASSWORD"
          [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] && MISSING="$MISSING ANDROID_KEY_ALIAS"
          [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ] && MISSING="$MISSING ANDROID_KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required release-signing secrets:$MISSING"
            echo "::error::Configure GitHub Actions secrets before releasing (see BLD-485 / fdroid/release-cert.sha256)."
            exit 1
          fi
          if [ ! -f fdroid/release-cert.sha256 ]; then
            echo "::error::Expected cert fingerprint file fdroid/release-cert.sha256 is missing."
            exit 1
          fi
          echo "All release-signing secrets present."

      - name: Get latest tag
        id: latest_tag
        run: |
          TAG=$(git tag --sort=-v:refname | grep '^v' | head -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest tag: $TAG"

      - name: Check for new commits since last tag
        id: check_commits
        run: |
          TAG="${{ steps.latest_tag.outputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "No existing tags — will create initial release"
            echo "has_new_commits=true" >> "$GITHUB_OUTPUT"
            echo "commit_count=initial" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(git rev-list "$TAG"..HEAD --count)
            echo "Commits since $TAG: $COUNT"
            echo "commit_count=$COUNT" >> "$GITHUB_OUTPUT"
            if [ "$COUNT" -gt 0 ]; then
              echo "has_new_commits=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_new_commits=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Exit if no new commits
        if: steps.check_commits.outputs.has_new_commits != 'true'
        run: |
          echo "No new commits since ${{ steps.latest_tag.outputs.tag }}. Skipping release."
          exit 0

      # BLD-1027: CHANGELOG.md gate. The `publish-release` skill marks
      # CHANGELOG.md as the *single source of truth* for release notes (in-app
      # What's New, GitHub Release body, F-Droid sidecars). Before BLD-1027
      # this workflow happily bumped versionCode every 12h without touching
      # CHANGELOG.md, so v0.26.20–v0.26.22 escaped the gate with raw `git log`
      # release notes and no F-Droid sidecars (see BLD-1026 diagnosis).
      #
      # Now: a populated `## Unreleased` section is *required* for the
      # workflow to ship. If it's missing or empty, no-op the release with a
      # clear notice — same pattern as the "no new commits" exit above. The
      # only escape hatch is to either curate the section or cancel the run.
      - name: Gate on CHANGELOG.md `## Unreleased` section
        if: steps.check_commits.outputs.has_new_commits == 'true'
        id: changelog_gate
        run: |
          set -euo pipefail
          # Republish mode (BLD-1101): skip the gate entirely. The CHANGELOG
          # has already been promoted in a prior run; we are only re-running
          # the build/release steps for the existing version.
          if [ "${{ inputs.republish_current }}" = "true" ]; then
            echo "::notice::Republish mode — bypassing CHANGELOG '## Unreleased' gate."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md is missing — cannot release without curated notes."
            exit 1
          fi
          # Extract body of the `## Unreleased` section: everything between
          # `## Unreleased` and the next `## ` header. macOS/BSD-safe awk.
          BODY=$(awk '
            /^##[[:space:]]+Unreleased[[:space:]]*$/ { in_u = 1; next }
            in_u && /^## / { exit }
            in_u { print }
          ' CHANGELOG.md)
          # Strip whitespace + the placeholder sentinel used between releases.
          STRIPPED=$(printf '%s\n' "$BODY" \
            | sed -E 's/_No user-facing changes yet\._//I' \
            | tr -d '[:space:]')
          if [ -z "$STRIPPED" ]; then
            echo "::notice::CHANGELOG.md has no curated '## Unreleased' content — skipping scheduled release."
            echo "::notice::Add bullets to the '## Unreleased' section in CHANGELOG.md to ship the next version."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Curated '## Unreleased' content found — proceeding with release."
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Stop here if CHANGELOG gate said skip
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release != 'true'
        run: |
          echo "CHANGELOG gate said skip. Exiting workflow successfully (no-op)."
          exit 0

      - name: Compute next version
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        id: next_version
        env:
          # GH_TOKEN is used by `scripts/compute-next-release-version.sh`
          # for the belt-and-suspenders GitHub-Release existence check
          # inside its `version_is_poisoned` helper. GITHUB_TOKEN has
          # repo-scoped read on releases which is sufficient — no PAT
          # needed for this read.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Republish mode (BLD-1101): use the version already committed in
          # package.json. The bump/promote steps below are skipped, and the
          # tag must not yet exist.
          if [ "${{ inputs.republish_current }}" = "true" ]; then
            NEXT=$(node -p "require('./package.json').version")
            if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
              echo "::error::Republish mode requested but tag v$NEXT already exists. Use the bump path instead."
              exit 1
            fi
            echo "version=$NEXT" >> "$GITHUB_OUTPUT"
            echo "Republish version (from package.json): $NEXT"
            exit 0
          fi
          # BLD-3223: bump-path next-version computation is delegated to
          # `scripts/compute-next-release-version.sh`, which encapsulates a
          # bounded skip loop over three independent poisoning signals
          # (local tag, remote tag, GitHub Release). Extracted from the
          # workflow so it can be unit-tested with stubbed git/gh (see
          # scripts/__tests__/compute-next-release-version.test.ts).
          # See the script's own header for the ghost-release caveat and
          # the create-time counterpart in "Create GitHub Release with APK".
          TAG="${{ steps.latest_tag.outputs.tag }}"
          NEXT=$(bash scripts/compute-next-release-version.sh "$TAG")
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT"

      - name: Compute next version code
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        id: next_vcode
        run: |
          # Republish mode (BLD-1101): use the versionCode already committed
          # in fdroid metadata (no +1 increment).
          if [ "${{ inputs.republish_current }}" = "true" ]; then
            NEXT=$(grep 'CurrentVersionCode:' fdroid/metadata/com.persoack.cablesnap.yml | awk '{print $2}')
            echo "version_code=$NEXT" >> "$GITHUB_OUTPUT"
            echo "Republish version code (from fdroid metadata): $NEXT"
            exit 0
          fi
          CURRENT=$(grep 'CurrentVersionCode:' fdroid/metadata/com.persoack.cablesnap.yml | awk '{print $2}')
          NEXT=$((CURRENT + 1))
          echo "version_code=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version code: $NEXT"

      # Setup Node + deps BEFORE the bump applier — `scripts/release-apply-bump.sh`
      # invokes `npm run changelog:gen` which needs `tsx`. The Android build
      # below also needs `node_modules` for `expo prebuild`, so we install once
      # here and the cached node_modules are reused.
      - name: Set up Node.js
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # BLD-4268: `expo prebuild` fails at `withAndroidDangerousBaseMod` with
      # `Cannot find module './utils/history'` when the setup-node `cache: 'npm'`
      # step restores a corrupted/partial `@expo/config-plugins` tarball, so
      # `npm ci` extracts an incomplete tree missing internal build/utils/*.js.
      # Guard: after `npm ci`, assert the lazy-required internal file exists;
      # if not, purge the offending tarball from the npm cache and reinstall
      # (`npm rebuild` is insufficient — it does not re-extract the tarball).
      # Fail loudly if a second install still cannot produce the file.
      - name: Install dependencies
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          npm ci
          GUARD_FILE="node_modules/@expo/config-plugins/build/utils/history.js"
          if [ ! -f "$GUARD_FILE" ]; then
            echo "::warning::Corrupt npm cache detected — $GUARD_FILE missing after npm ci. Purging @expo/config-plugins from npm cache and reinstalling."
            npm cache ls @expo/config-plugins 2>/dev/null || true
            # Nuke the whole npm download cache — safer than trying to
            # surgically remove a single tarball across cacache layouts.
            npm cache clean --force
            rm -rf node_modules
            npm ci
            if [ ! -f "$GUARD_FILE" ]; then
              echo "::error::$GUARD_FILE still missing after cache purge + reinstall. Upstream tarball may be broken."
              exit 1
            fi
            echo "Recovered: $GUARD_FILE present after cache purge + reinstall."
          fi

      # Lint + unit test gate — mirrors ci.yml exactly so a red suite can never
      # ship via the scheduled cron. Runs AFTER npm ci (node_modules ready) and
      # BEFORE version bump/build so a failing check aborts fast and leaves main
      # unmutated (ATOMIC RELEASE philosophy — BLD-2139).
      - name: Lint and unit tests (release gate)
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          echo "--- Lint (eslint, --max-warnings=17) ---"
          npm run lint -- --max-warnings=17
          echo "--- Unit tests (jest, --ci --runInBand) ---"
          npm test -- --ci --runInBand

      # BLD-1185: bump package.json + app.config.ts + fdroid metadata, promote
      # `## Unreleased` → `## vX.Y.Z — DATE`, and refresh
      # `lib/changelog.generated.ts` + F-Droid sidecar — all via a single
      # idempotent script.
      #
      # BLD-2139 (ATOMIC RELEASE): this step now runs BEFORE the build and
      # smoke test. The bumped working tree is used for the build (so the APK
      # carries the correct versionCode / versionName), but the commit/push is
      # deferred until AFTER all validation passes (see "Commit and push" below).
      # The script is also re-invoked from "Commit and push" if a concurrent
      # merge forces a rebase onto fresh origin/main.
      - name: Apply release bump (version + CHANGELOG + generated artefacts)
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true' && inputs.republish_current != true
        run: |
          VERSION="${{ steps.next_version.outputs.version }}"
          VCODE="${{ steps.next_vcode.outputs.version_code }}"
          bash scripts/release-apply-bump.sh "$VERSION" "$VCODE"

      # Republish mode (BLD-1101): no version bump or `## Unreleased` promotion,
      # but lib/changelog.generated.ts + F-Droid sidecar must still match the
      # already-committed version.
      - name: Regenerate changelog artifacts (republish mode)
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true' && inputs.republish_current == true
        run: |
          set -euo pipefail
          npm run changelog:gen
          VCODE="${{ steps.next_vcode.outputs.version_code }}"
          SIDECAR="fdroid/metadata/com.persoack.cablesnap/en-US/changelogs/${VCODE}.txt"
          if [ ! -s "$SIDECAR" ]; then
            echo "::error::Expected F-Droid sidecar $SIDECAR to be written by changelog:gen but it is missing or empty."
            exit 1
          fi
          echo "Wrote $SIDECAR ($(wc -c < "$SIDECAR") bytes)"

      - name: Resolve signing migration boundary and README
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          VERSION="${{ steps.next_version.outputs.version }}"
          python3 - "$VERSION" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          marker_path = Path("fdroid/signing-migration.json")
          readme_path = Path("README.md")
          try:
              marker = json.loads(marker_path.read_text())
              boundary = marker["boundaryTag"]
          except (FileNotFoundError, json.JSONDecodeError, KeyError, TypeError) as exc:
              raise SystemExit(f"signing migration marker is missing or unparseable: {exc}")
          if boundary is not None and (not isinstance(boundary, str) or not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", boundary)):
              raise SystemExit("signing migration marker boundaryTag must be null or a release tag like v0.27.0")

          pending = "boundary release pending — see release notes"
          start = "<!-- SIGNING_MIGRATION_NOTICE_START -->"
          end = "<!-- SIGNING_MIGRATION_NOTICE_END -->"
          readme = readme_path.read_text()
          if readme.count(start) != 1 or readme.count(end) != 1:
              raise SystemExit("README signing migration notice markers are missing or duplicated")
          if boundary is None:
              if "${{ inputs.republish_current }}" == "true":
                  raise SystemExit("signing migration boundary is unset; republish mode cannot establish the boundary release")
              if readme.count(pending) != 1:
                  raise SystemExit("README signing migration pending notice is missing or duplicated")
              boundary = f"v{sys.argv[1]}"
              marker_path.write_text(json.dumps({"boundaryTag": boundary}) + "\n")
              readme_path.write_text(readme.replace(pending, boundary))
          else:
              if pending in readme or readme.count(boundary) != 1:
                  raise SystemExit("README signing migration notice is out of sync with fdroid/signing-migration.json")
          print(f"Signing migration boundary: {boundary}")
          PY

      # --- Build APK BEFORE creating release (immutable releases block later uploads) ---

      - name: Set up JDK 17
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        uses: android-actions/setup-android@v3

      # Node.js + npm install already happened earlier (before changelog
      # promotion + regen). The cached node_modules are reused here for
      # `expo prebuild` and the Android build.

      - name: Sanitize Expo sources before autolinking
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        env:
          CABLESNAP_FDROID: "1"
        run: |
          # expo-modules-autolinking runs while prebuild evaluates the native
          # project. Calling this only after prebuild is too late: it has
          # already emitted dependencies on publisher local AARs. Remove
          # those artifacts and rewrite sources before autolinking scans them.
          node - <<'NODE'
          const {
            patchFdroidExpoDependencies,
            patchFdroidLibrarySources,
          } = require('./plugins/with-wearos-module');
          patchFdroidExpoDependencies(process.cwd());
          // Prebuild has already generated module BuildConfig/source outputs;
          // sanitize their sources without deleting those outputs.
          patchFdroidLibrarySources(process.cwd(), { removeGeneratedArtifacts: false });
          NODE

      - name: Generate native project (F-Droid)
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        env:
          CABLESNAP_FDROID: "1"
          # Sentry Expo config plugin reads these at prebuild time to generate
          # android/sentry.properties. Missing values are handled gracefully
          # (the plugin emits warning comments and falls back to env at build
          # time), so an unconfigured secret does NOT break the release.
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npx expo prebuild --clean --platform android

      - name: Strip direct proprietary Expo dependencies
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        env:
          CABLESNAP_FDROID: "1"
        run: |
          node - <<'NODE'
          const {
            patchFdroidExpoDependencies,
            patchFdroidLibrarySources,
            patchFdroidAndroidGradleTree,
          } = require('./plugins/with-wearos-module');
          patchFdroidExpoDependencies(process.cwd());
          patchFdroidLibrarySources(process.cwd(), {
            removeGeneratedArtifacts: false,
            rewriteSources: false,
          });
          // Run after prebuild has materialised every generated Android
          // library script. The config plugin's dangerous-mod hook can run
          // before some Expo scripts are copied into the native project.
          patchFdroidAndroidGradleTree(process.cwd());
          NODE
          grep -nE 'compileOnly.*(firebase|installreferrer)|barcodeDependencyConfiguration' \
            node_modules/expo-notifications/android/build.gradle \
            node_modules/expo-application/android/build.gradle \
            node_modules/expo-camera/android/build.gradle

      - name: Disable Expo Camera barcode dependency graph for F-Droid
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        env:
          CABLESNAP_FDROID: "1"
        run: |
          # CableSnap renders the open-source expo-foss-barcode-scanner view
          # for Android. Disable Expo Camera's optional scanner graph as a
          # second, property-level guard; this prevents AGP from resolving
          # the ML Kit graph while retaining CameraX preview functionality.
          printf '\nexpo.camera.barcode-scanner-enabled=false\n' >> android/gradle.properties
          grep 'expo.camera.barcode-scanner-enabled=false' android/gradle.properties
          # Prebuild and Expo autolinking can leave publisher-side Android
          # intermediates under the generated project. They are disposable and
          # must not be allowed to seed the F-Droid variant's dex merge.
          rm -rf android/app/build android/build android/wear/build
          # Gradle's transformed-AAR cache is outside the project and can
          # survive clean/prebuild cycles. Remove only transform metadata so
          # a stale proprietary AAR cannot be selected as a release fallback;
          # Gradle will recreate the needed open-source transforms.
          rm -rf "$HOME/.gradle/caches/9.0.0/transforms" \
            "$HOME/.gradle/caches/9.0.0/fileContent" \
            "$HOME/.gradle/caches/9.0.0/fileHashes"
          # Keep the F-Droid exclusions in the app project as a final
          # post-prebuild guard, independent of config-plugin ordering.
          cat >> android/app/build.gradle <<'GRADLE'

          // cablesnap:ci:fdroid-final-excludes
          if (System.getenv("CABLESNAP_FDROID") == "1") {
              configurations.configureEach {
                  exclude group: "com.google.android.gms"
                  exclude group: "com.google.firebase"
                  exclude group: "com.google.mlkit"
                  exclude group: "com.android.installreferrer"
                  exclude module: "camera-mlkit-vision"
              }
          }
          GRADLE
          cat >> android/app/proguard-rules.pro <<'PROGUARD'

          # F-Droid deliberately removes these optional Expo integrations.
          # Their native methods remain in compile-time Expo library classes,
          # so R8 must be told that the absent optional types are intentional;
          # unreachable methods are then removed from the releaseFdroid dex.
          -dontwarn com.android.installreferrer.**
          -dontwarn com.google.android.gms.**
          -dontwarn com.google.firebase.**
          -dontwarn com.google.mlkit.**
          -ignorewarnings
          PROGUARD

      - name: Boost Gradle JVM heap
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        run: |
          # expo prebuild --clean regenerates android/gradle.properties with
          # org.gradle.jvmargs=-Xmx2048m, which is borderline for
          # assembleRelease: :app:mergeReleaseNativeDebugMetadata routinely
          # OOMs on the ubuntu-latest runner. Bump to 6g so the build can
          # finish and the apksigner fingerprint step can run.
          set -euo pipefail
          PROPS=android/gradle.properties
          if grep -q '^org.gradle.jvmargs=' "$PROPS"; then
            sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m|' "$PROPS"
          else
            echo 'org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m' >> "$PROPS"
          fi
          grep '^org.gradle.jvmargs=' "$PROPS"

      - name: Decode release keystore and write keystore.properties
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::$secret_name is empty — configure the release-signing secret before releasing."
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then
            echo "::error::Decoded release.keystore is empty — check ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi
          cat > android/keystore.properties <<PROPS
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS
          chmod 600 android/keystore.properties android/app/release.keystore
          echo "Wrote android/keystore.properties (storeFile=release.keystore, alias=$ANDROID_KEY_ALIAS)"

      - name: Build F-Droid APK
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        env:
          CABLESNAP_FDROID: "1"
          # Sentry Android Gradle plugin reads these to upload debug symbols +
          # source maps during assembleRelease. Missing SENTRY_AUTH_TOKEN is
          # tolerated: the plugin logs a warning and ships an APK without
          # source maps rather than hard-failing the build.
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          # M0 (BLD-736) introduces a phone-app build-type split (pivoted from
          # productFlavors after CEO approval 2026-04-28; see plan addendum):
          #   - release       — Watch bridge + GMS Wearable wired in (Play).
          #   - releaseFdroid — initWith release; bridge + GMS excluded via
          #                     :app configurations excludes (F-Droid-safe).
          # The Wear OS standalone watch APK is also built here (Play-only).
          # See .plans/PLAN-BLD-716.md §"F-Droid + Play split" + §"Watch APK
          # distribution".
          set -euo pipefail
          cd android
           # Build each variant in a separate Gradle invocation. A single
           # invocation creates a combined task graph, allowing Play release
           # library artifacts to satisfy releaseFdroid matchingFallbacks.
           # Keeping the F-Droid graph isolated is required for DEX purity.
           ./gradlew --refresh-dependencies --no-build-cache --no-daemon :app:assembleReleaseFdroid
           # Preserve the clean F-Droid APK before the Play invocation can
           # reuse or overwrite app/build outputs.
           cp app/build/outputs/apk/releaseFdroid/app-releaseFdroid.apk ../cablesnap-fdroid.apk
           FROID_HITS=$(unzip -p ../cablesnap-fdroid.apk 'classes*.dex' 2>/dev/null | strings \
             | grep -oE 'com/google/firebase[A-Za-z0-9_$./-]*|com/google/mlkit[A-Za-z0-9_$./-]*|com/google/android/gms[A-Za-z0-9_$./-]*|com/android/installreferrer[A-Za-z0-9_$./-]*' \
             | sort -u || true)
           if [ -n "$FROID_HITS" ]; then
             echo "::error::F-Droid APK was impure immediately after its isolated build:"
             printf '%s\n' "$FROID_HITS"
             ./gradlew :app:dependencies --configuration releaseFdroidRuntimeClasspath || true
             exit 1
           fi
           cd ..
           echo "Built F-Droid artifact:"
           ls -lh cablesnap-fdroid.apk

      # F-Droid sanitization destructively rewrites node_modules. Restore the
      # pristine dependency tree before the Play prebuild; the Play channel is
      # actually stamped by createExpoConfig during the Gradle invocation.
      - name: Restore pristine dependencies for GitHub / Play
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci
          GUARD_FILE="node_modules/@expo/config-plugins/build/utils/history.js"
          if [ ! -f "$GUARD_FILE" ]; then
            echo "::warning::Corrupt npm cache detected — $GUARD_FILE missing after restore npm ci. Purging @expo/config-plugins from npm cache and reinstalling."
            npm cache ls @expo/config-plugins 2>/dev/null || true
            npm cache clean --force
            rm -rf node_modules
            npm ci
            if [ ! -f "$GUARD_FILE" ]; then
              echo "::error::$GUARD_FILE still missing after cache purge + reinstall. Upstream tarball may be broken."
              exit 1
            fi
          fi
          node - <<'NODE'
          const fs = require('fs');
          for (const name of ['expo-notifications', 'expo-application']) {
            const config = JSON.parse(fs.readFileSync(`node_modules/${name}/expo-module.config.json`, 'utf8'));
            if (!config.platforms || !config.platforms.includes('android')) {
              throw new Error(`${name} is still missing Android from expo-module.config.json`);
            }
            const pkg = JSON.parse(fs.readFileSync(`node_modules/${name}/package.json`, 'utf8'));
            if (pkg.expo?.autolinking?.exclude?.includes(name)) {
              throw new Error(`${name} remains excluded from autolinking in package.json`);
            }
          }
          NODE

      # The second clean prebuild resets the android/ tree before the Play
      # build. Its createExpoConfig Gradle task will stamp the GitHub channel
      # using the environment of the later Gradle invocation.
      - name: Generate native project (GitHub / Play)
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        env:
          # Deliberately omitted: CABLESNAP_FDROID must be unset for this
          # prebuild, not merely set to "0", so app.config.ts takes its Play
          # / GitHub path.
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          npx expo prebuild --clean --platform android

      - name: Boost Gradle JVM heap (GitHub / Play)
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          PROPS=android/gradle.properties
          if grep -q '^org.gradle.jvmargs=' "$PROPS"; then
            sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m|' "$PROPS"
          else
            echo 'org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m' >> "$PROPS"
          fi
          grep '^org.gradle.jvmargs=' "$PROPS"

      # Every --clean prebuild deletes android/keystore.properties and the
      # keystore. Rewrite both after the Play prebuild and immediately before
      # its Gradle invocation, just as for the F-Droid build above.
      - name: Decode release keystore and write keystore.properties (GitHub / Play)
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::$secret_name is empty — configure the release-signing secret before releasing."
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then
            echo "::error::Decoded release.keystore is empty — check ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi
          cat > android/keystore.properties <<PROPS
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS
          chmod 600 android/keystore.properties android/app/release.keystore
          test -s android/keystore.properties
          echo "Wrote android/keystore.properties (storeFile=release.keystore, alias=$ANDROID_KEY_ALIAS)"

      - name: Build GitHub / Play APKs
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        env:
          # Deliberately omitted: the Play APK must embed distributionChannel
          # "github" and use the normal dependency graph.
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          cd android
          test -s keystore.properties
          # The clean prebuild and npm ci above provide phase isolation. Reuse
          # Gradle's downloaded dependency cache instead of forcing a second
          # full network re-resolution; keep daemon isolation for channel safety.
          ./gradlew --no-daemon :app:assembleRelease :wear:assembleRelease
          cd ..
          # Keep the existing Play / GitHub release asset names unchanged.
          cp android/app/build/outputs/apk/release/app-release.apk cablesnap.apk
          cp android/wear/build/outputs/apk/release/wear-release.apk cablesnap-wear.apk
          echo "Built artifacts:"
          ls -lh cablesnap.apk cablesnap-fdroid.apk cablesnap-wear.apk

      - name: Verify embedded distribution channels
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          verify_channel() {
            local apk="$1"
            local expected="$2"
            local config actual
            config=$(unzip -p "$apk" assets/app.config)
            if command -v jq >/dev/null 2>&1; then
              actual=$(printf '%s' "$config" | jq -r '.extra.distributionChannel // empty')
            else
              actual=$(CONFIG_JSON="$config" python3 -c 'import json, os; print(json.loads(os.environ["CONFIG_JSON"]).get("extra", {}).get("distributionChannel", ""))')
            fi
            if [ "$actual" != "$expected" ]; then
              echo "::error::$apk embeds distributionChannel=$actual; expected $expected"
              exit 1
            fi
            echo "$apk embeds distributionChannel=$expected"
          }
          verify_channel cablesnap.apk github
          verify_channel cablesnap-fdroid.apk fdroid

      - name: AC10b — verify F-Droid APK contains no proprietary SUSS classes
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          TMPDIR_DEX=$(mktemp -d)
          trap 'rm -rf "$TMPDIR_DEX"' EXIT
          unzip -q -o cablesnap-fdroid.apk 'classes*.dex' -d "$TMPDIR_DEX"
          HITS=$(strings "$TMPDIR_DEX"/classes*.dex \
            | grep -oE 'com/google/firebase[A-Za-z0-9_$./-]*|com/google/mlkit[A-Za-z0-9_$./-]*|com/google/android/gms[A-Za-z0-9_$./-]*|com/android/installreferrer[A-Za-z0-9_$./-]*' \
            | sort -u || true)
          printf '%s\n' "$HITS"
          if [ -n "$HITS" ]; then
            echo "::error::AC10b violated — proprietary SUSS classes found in cablesnap-fdroid.apk:"
            printf '%s\n' "$HITS"
            exit 1
          fi
          echo "AC10b OK — F-Droid APK contains none of the four SUSS prefixes."

      - name: AC10c — verify Play APK contains proprietary and Expo native classes
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          GMS_FIREBASE_HITS=$(unzip -p cablesnap.apk 'classes*.dex' 2>/dev/null | strings \
            | grep -oE 'com/google/android/gms|com/google/firebase' | sort -u || true)
          NOTIFICATIONS_HITS=$(unzip -p cablesnap.apk 'classes*.dex' 2>/dev/null | strings \
            | grep -oE 'expo/modules/notifications' | sort -u || true)
          APPLICATION_HITS=$(unzip -p cablesnap.apk 'classes*.dex' 2>/dev/null | strings \
            | grep -oE 'expo/modules/application' | sort -u || true)
          if [ -z "$GMS_FIREBASE_HITS" ] || [ -z "$NOTIFICATIONS_HITS" ] || [ -z "$APPLICATION_HITS" ]; then
            echo "::error::AC10c violated — cablesnap.apk is missing expected Play native classes (GMS/Firebase and/or Expo notifications/application)."
            echo "GMS/Firebase matches: ${GMS_FIREBASE_HITS:-<none>}"
            echo "Expo notifications matches: ${NOTIFICATIONS_HITS:-<none>}"
            echo "Expo application matches: ${APPLICATION_HITS:-<none>}"
            exit 1
          fi
          echo "AC10c OK — Play APK contains GMS/Firebase and Expo notifications/application classes."

      - name: Verify APK signature matches committed fingerprint
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "::error::No Android build-tools found under $ANDROID_HOME/build-tools."
            exit 1
          fi
          APKSIGNER="${BUILD_TOOLS_DIR}apksigner"
          echo "Using apksigner: $APKSIGNER"

          EXPECTED_NORM=$(head -1 fdroid/release-cert.sha256 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          if ! echo "$EXPECTED_NORM" | grep -qE '^[0-9A-F]{64}$'; then
            echo "::error::Expected fingerprint in fdroid/release-cert.sha256 is not a valid 64-char hex SHA-256."
            exit 1
          fi

          verify_apk_signature() {
            local apk="$1"
            local log="$2"
            if [ ! -s "$apk" ]; then
              echo "::error::Missing or empty APK: $apk"
              return 1
            fi
            if ! "$APKSIGNER" verify "$apk"; then
              echo "::error::apksigner verify reports $apk is INVALID."
              return 1
            fi
            "$APKSIGNER" verify --print-certs "$apk" | tee "$log"
            local actual_list
            # Preserve newlines: sort -u/unique_count depend on one digest per line.
            actual_list=$(grep -oE 'certificate SHA-256 digest:[[:space:]]+[0-9a-fA-F:]+' "$log" \
              | sed -E 's/^certificate SHA-256 digest:[[:space:]]+//' \
              | tr -d ':[:blank:]' | tr '[:lower:]' '[:upper:]')
            if [ -z "$actual_list" ]; then
              echo "::error::Could not parse any SHA-256 certificate digest from $log."
              return 1
            fi
            local unique_count
            unique_count=$(printf '%s\n' "$actual_list" | sort -u | wc -l | tr -d '[:space:]')
            if [ "$unique_count" -ne 1 ]; then
              echo "::error::$apk reports more than one distinct signer fingerprint."
              printf '%s\n' "$actual_list" | sort -u | sed 's/^/  /'
              return 1
            fi
            local actual_norm
            actual_norm=$(printf '%s\n' "$actual_list" | sort -u)
            if ! printf '%s\n' "$actual_norm" | grep -qE '^[0-9A-F]{64}$'; then
              echo "::error::Parsed signer fingerprint for $apk is not a valid 64-char SHA-256."
              return 1
            fi
            echo "Expected SHA-256: $EXPECTED_NORM"
            echo "Actual   SHA-256: $actual_norm"
            if [ "$actual_norm" != "$EXPECTED_NORM" ]; then
              echo "::error::$apk cert fingerprint does not match fdroid/release-cert.sha256."
              return 1
            fi
            echo "Cert fingerprint verified for $apk: $actual_norm"
          }

          verify_apk_signature cablesnap.apk apksigner.log
          verify_apk_signature cablesnap-wear.apk apksigner-wear.log

      # --- KVM permission enable (BLD-2290) ---
      #
      # On some GitHub-hosted runners /dev/kvm exists but the runner user lacks
      # rw permission, so android-emulator-runner falls back to software TCG
      # emulation (-accel off), which deadlocks ("detected a hanging thread
      # 'QEMU2 CPU1 thread'") and never boots (BLD-2289, recurrence of BLD-2137).
      # Apply the reactivecircus/android-emulator-runner README's mandated udev
      # rule so /dev/kvm becomes world-rw and real KVM acceleration engages.
      # Best-effort: || true so the step never hard-fails on the perms tweak.
      # Gate mirrors the primary smoke test's if: condition so this step runs
      # iff the emulator would run.
      - name: Enable KVM acceleration for emulator
        id: kvm
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null || true
            sudo udevadm control --reload-rules || true
            sudo udevadm trigger --name-match=kvm || true
            ls -l /dev/kvm || true
          else
            echo "::warning::/dev/kvm absent on this runner — KVM acceleration unavailable. The emulator step will fail loudly if acceleration cannot engage (disable-linux-hw-accel: false)."
          fi

      # --- Emulator smoke test: verify APK launches without crashing ---
      #
      # BLD-2139 (ATOMIC RELEASE): this step now runs BEFORE "Commit and push".
      # If the emulator boot fails (broken pipe / boot timeout in the action's
      # own pre-script phase), a second attempt is made on a fresh emulator via
      # the step below (gated on failure of this step). The second attempt uses
      # `continue-on-error: false` so a genuine app crash on the first attempt
      # (exit 1 from smoke-test-emulator.sh) still hard-fails the workflow
      # without triggering the infra-retry path.
      #
      # Infrastructure-flake detection strategy:
      #   - Exit code 0 from smoke-test-emulator.sh → test passed.
      #   - Exit code 1 → app failure (FATAL EXCEPTION or process-not-found on
      #     a healthy emulator). Hard fail. No infra-retry.
      #   - Exit code 2 → infra failure (dead/unreachable emulator detected by
      #     the script's own dead-emulator guard). Script already attempted an
      #     internal health-restore; this signals a second fresh-emulator retry.
      #   - Non-zero exit from the action's *boot phase* (before the script
      #     runs at all) → action-level failure, outcome == 'failure'. The
      #     retry step below catches this case.
      #
      # The `continue-on-error: true` on this step is intentional: we need
      # `steps.smoke_test_primary.outcome` to be readable regardless of
      # outcome so the retry step's `if:` condition can evaluate it. The
      # overall workflow still fails if the retry also fails (see the
      # "Fail if smoke test could not be completed" step at the end).

      - name: Android emulator smoke test
        id: smoke_test_primary
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          # Boot timeout raised to 900s (15 min) — the runner is under heavy
          # load after a ~30 min Gradle build + AVD creation. Run #28322396584
          # (BLD-2137) died at 8 min with broken-pipe/exit-224 in the action's
          # own post-boot setup; 600s was borderline. 900s gives more headroom
          # without meaningfully affecting happy-path wall-clock time.
          emulator-boot-timeout: 900
          # Speed up boot on headless runners: no window, software GPU, no
          # audio, no boot animation, no snapshot save. Reduces boot time and
          # avoids GPU init hangs.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          disable-animations: true
          # BLD-2290: force real KVM/HW acceleration. The action's default is
          # `auto`, which can misdetect and silently disable acceleration →
          # software CPU emulation (the BLD-2289 failure: QEMU2 CPU1 hang,
          # ~90 min burn). With the 99-kvm4all.rules perms applied in the KVM
          # step above, `false` makes the emulator hard-require acceleration;
          # if it genuinely can't accelerate the step fails loudly/fast instead
          # of crawling in software mode. Mirrors e2e-android-emulator.yml.
          disable-linux-hw-accel: false
          # cores: 2 reduces QEMU contention on the shared ubuntu-latest runner
          # under post-build load; AVD boot is I/O + CPU bound, not RAM bound.
          cores: 2
          script: |
            bash scripts/smoke-test-emulator.sh

      # BLD-2139: Infra-flake retry on a FRESH emulator. Only triggered when
      # the primary smoke test failed (action boot failure OR exit 2 from the
      # script). We do NOT retry on a genuine app crash (exit 1 from the
      # script maps to `smoke_test_primary.outcome == 'failure'` and is caught
      # by the "Fail if smoke test could not be completed" step below via
      # the absence of a successful primary or retry).
      #
      # Distinguishing infra flake from app crash at workflow level:
      #   The script exits 1 for app failures and 2 for infra failures. Both
      #   map to `outcome == 'failure'` at the action level (any non-zero exit
      #   is a failure). We cannot directly read the script's exit code from
      #   a subsequent step. To avoid masking genuine app crashes, the retry
      #   step is deliberately unconditional on failure — it re-runs the FULL
      #   smoke test on a fresh emulator. If the app actually crashed, it will
      #   crash again on the fresh emulator and the retry will also fail,
      #   causing "Fail if smoke test could not be completed" to hard-fail the
      #   release (correct). If the failure was an infra flake, the retry on a
      #   fresh emulator will succeed (also correct). There is no path by which
      #   a genuine app crash is masked.
      - name: Android emulator smoke test (infra-flake retry)
        id: smoke_test_retry
        if: >
          steps.check_commits.outputs.has_new_commits == 'true' &&
          steps.changelog_gate.outputs.should_release == 'true' &&
          steps.smoke_test_primary.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          disable-animations: true
          # BLD-2290: force real KVM/HW acceleration on retry as well.
          # Same rationale as primary smoke test step above.
          disable-linux-hw-accel: false
          cores: 2
          # force-avd-creation ensures a completely clean AVD for the retry,
          # eliminating any stale state from the failed primary attempt.
          force-avd-creation: true
          script: |
            bash scripts/smoke-test-emulator.sh

      # Hard gate: if both smoke test attempts failed (or only the primary ran
      # and failed with no retry needed), fail the workflow here BEFORE
      # "Commit and push". This is what makes the release atomic — a flaky
      # emulator can never strand a committed-but-unreleased version on main.
      - name: Fail if smoke test could not be completed
        if: >
          steps.check_commits.outputs.has_new_commits == 'true' &&
          steps.changelog_gate.outputs.should_release == 'true' &&
          steps.smoke_test_primary.outcome == 'failure' &&
          (steps.smoke_test_retry.outcome == 'failure' || steps.smoke_test_retry.outcome == 'skipped')
        run: |
          echo "::error::Android emulator smoke test failed on both attempts (primary + infra-flake retry)."
          echo "::error::The release has been aborted. main is clean — no version-bump commit was pushed."
          echo "::error::Check the emulator runner logs above. If this is a persistent infra failure, re-run the workflow."
          exit 1

      # --- Commit and push (deferred until ALL validation passes) ---
      #
      # BLD-2139 (ATOMIC RELEASE): this step was previously step 16 (before
      # the build and emulator smoke test). It now runs AFTER the emulator
      # smoke test. If the smoke test fails, this step is never reached, so
      # main is never mutated by a flaky CI run.
      #
      # BLD-1185: Release notes are generated AFTER this step so they always
      # reflect the final post-recovery CHANGELOG.md. If push rejection
      # triggered the regenerate path, the local CHANGELOG.md now reflects
      # the merged-on-top concurrent contributor bullets (because the script
      # promoted them into the v$VERSION section), and the release notes will
      # include them. Generating these notes earlier caused a real
      # release-consistency bug — see PR #575 review thread.
      - name: Commit and push
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true' && github.ref == 'refs/heads/main' && inputs.republish_current != true
        run: |
          set -euo pipefail
          VERSION="${{ steps.next_version.outputs.version }}"
          VCODE="${{ steps.next_vcode.outputs.version_code }}"
          git config user.name "CableSnap Release Bot"
          git config user.email "release-bot@cablesnap.app"

          stage_paths() {
            git add package.json app.config.ts fdroid/metadata/com.persoack.cablesnap.yml \
              CHANGELOG.md \
              lib/changelog.generated.ts \
              fdroid/metadata/com.persoack.cablesnap/en-US/changelogs/ \
              fdroid/signing-migration.json README.md
          }

          stage_paths
          if git diff --cached --quiet; then
            echo "Version files already at v$VERSION — skipping commit."
            exit 0
          fi
          git commit -m "release: v$VERSION"

          # BLD-1185: retry up to 5 times on push rejection. On ANY rejection
          # we hard-reset onto fresh origin/main and re-apply the bump from
          # scratch via `scripts/release-apply-bump.sh`. This is the single
          # recovery codepath — the script is idempotent and the reset is
          # cheap, so we deliberately drop the "plain rebase fast path" that
          # earlier versions of this step used. That fast path is unsafe:
          # `lib/changelog.generated.ts`, the F-Droid sidecar, and (later)
          # GitHub Release notes are all derived from `CHANGELOG.md`, so a
          # successful three-way merge of just `CHANGELOG.md` left those
          # generated artefacts stale relative to the rebased CHANGELOG and
          # could publish a release whose APK + sidecar + GitHub Release notes
          # disagreed with the merged CHANGELOG.md (reviewer + QD blocker on
          # PR #575). Always regenerating from the post-reset CHANGELOG.md
          # eliminates the divergence and preserves any concurrent
          # `## Unreleased` bullets automatically.
          pushed=0
          for i in 1 2 3 4 5; do
            if git push origin main; then
              pushed=1
              break
            fi
            echo "::warning::Push rejected (attempt $i). Resetting onto fresh origin/main and regenerating bump..."
            git fetch origin main
            git reset --hard origin/main
            bash scripts/release-apply-bump.sh "$VERSION" "$VCODE"
            python3 - "$VERSION" <<'PY'
            import json
            import re
            import sys
            from pathlib import Path

            marker_path = Path("fdroid/signing-migration.json")
            readme_path = Path("README.md")
            try:
                marker = json.loads(marker_path.read_text())
                boundary = marker["boundaryTag"]
            except (FileNotFoundError, json.JSONDecodeError, KeyError, TypeError) as exc:
                raise SystemExit(f"signing migration marker is missing or unparseable: {exc}")
            if boundary is not None and (not isinstance(boundary, str) or not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", boundary)):
                raise SystemExit("signing migration marker boundaryTag must be null or a release tag like v0.27.0")

            pending = "boundary release pending — see release notes"
            start = "<!-- SIGNING_MIGRATION_NOTICE_START -->"
            end = "<!-- SIGNING_MIGRATION_NOTICE_END -->"
            readme = readme_path.read_text()
            if readme.count(start) != 1 or readme.count(end) != 1:
                raise SystemExit("README signing migration notice markers are missing or duplicated")
            if boundary is None:
                boundary = f"v{sys.argv[1]}"
                if readme.count(pending) != 1:
                    raise SystemExit("README signing migration pending notice is missing or duplicated")
                marker_path.write_text(json.dumps({"boundaryTag": boundary}) + "\n")
                readme_path.write_text(readme.replace(pending, boundary))
            elif pending in readme or readme.count(boundary) != 1:
                raise SystemExit("README signing migration notice is out of sync with fdroid/signing-migration.json")
            print(f"Signing migration boundary: {boundary}")
          PY
            stage_paths
            if git diff --cached --quiet; then
              echo "::notice::No staged delta after regenerate — concurrent merge already shipped v$VERSION? exiting."
              pushed=1
              break
            fi
            git commit -m "release: v$VERSION"

            # Brief jitter to avoid lockstep with other concurrent pushers.
            sleep $((RANDOM % 5 + 2))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::Failed to push release commit after 5 recovery attempts."
            exit 1
          fi

      - name: Generate release notes
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true'
        id: release_notes
        run: |
          # BLD-1027: read release-notes body from CHANGELOG.md (single source
          # of truth — see publish-release SKILL Step 7). Replaces the
          # synthesised `git log` output that shipped in v0.26.20–v0.26.22.
          # macOS/BSD-safe awk: extract from the first `## v$VERSION` header
          # up to (but not including) the next `## ` header.
          #
          # BLD-1185: this step intentionally runs AFTER `Commit and push` so
          # it reads the post-recovery CHANGELOG.md. If push rejection
          # triggered the regenerate path, the local CHANGELOG.md now reflects
          # the merged-on-top concurrent contributor bullets (because the
          # script promoted them into the v$VERSION section), and the release
          # notes here will include them. Generating these notes earlier
          # caused a real release-consistency bug — see PR #575 review thread.
          set -euo pipefail
          VERSION="${{ steps.next_version.outputs.version }}"
          BODY=$(awk -v v="$VERSION" '
            $0 ~ "^## v"v"([^0-9]|$)" { in_section=1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md \
            | npx tsx scripts/strip-release-notes-comments.ts)
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has an empty body for v$VERSION — refusing to ship."
            exit 1
          fi
          MARKER=$(python3 - <<'PY'
          import json
          import re
          import sys
          try:
              value = json.load(open("fdroid/signing-migration.json"))["boundaryTag"]
          except (FileNotFoundError, json.JSONDecodeError, KeyError, TypeError) as exc:
              print(f"signing migration marker is missing or unparseable: {exc}", file=sys.stderr)
              raise SystemExit(1)
          if not isinstance(value, str) or not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", value):
              print("signing migration marker boundaryTag must be a release tag like v0.27.0", file=sys.stderr)
              raise SystemExit(1)
          print(value)
          PY
          )
          {
            echo 'notes<<NOTES_EOF'
            echo "## What's New"
            echo ""
            echo "$BODY"
            echo ""
            echo "## Install"
            echo ""
            echo "Add the F-Droid repo URL to your F-Droid client:"
            echo '```'
            echo "https://alankyshum.github.io/cablesnap/repo"
            echo '```'
            echo ""
             echo "The self-hosted F-Droid repo serves the production Play-flavor APK, which includes Google Play Services, Firebase, and ML Kit. For the GMS-free build, use the official F-Droid listing (https://f-droid.org/packages/com.persoack.cablesnap/) or the \`cablesnap-fdroid.apk\` release asset."
             echo ""
             if [ "v$VERSION" = "$MARKER" ]; then
               echo "### One-time self-hosted-repo reinstall warning"
               echo ""
               echo "This boundary release changes the self-hosted F-Droid repo signing key from the debug certificate to the production certificate. Users of that repo on this release must export a backup first, then uninstall and reinstall CableSnap once; Android will not update the app in place across this signing change, and uninstalling can delete local data."
               echo ""
             fi
            echo "## Wear OS companion (Play Store only)"
            echo ""
            echo "The Wear OS companion APK (\`cablesnap-wear.apk\`) is distributed via the Play Store only — F-Droid's Inclusion Criteria reject the GMS Wearable dependency the watch app needs. The GMS-free \`cablesnap-fdroid.apk\` build is fully functional on its own; the watch APK is an optional companion."
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Dry-run notice (non-main ref)
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true' && github.ref != 'refs/heads/main'
        run: |
          echo "::notice::Dry-run mode — ref is ${{ github.ref }}, not refs/heads/main."
          echo "::notice::Skipping 'Commit and push' and 'Create GitHub Release'; signed APK will be uploaded as a workflow artifact for review."

      # --- Create release WITH APK attached atomically ---

      - name: Upload dry-run signed APK + apksigner log (non-main ref)
        if: always() && steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-signed-apk
          path: |
            cablesnap.apk
            cablesnap-fdroid.apk
            cablesnap-wear.apk
            apksigner.log
          if-no-files-found: warn
          retention-days: 14

      - name: Create GitHub Release with APK
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.changelog_gate.outputs.should_release == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
        run: |
          # All three artifacts are attached to the same GitHub Release:
          #   cablesnap.apk          — Play-flavor phone APK (canonical)
          #   cablesnap-fdroid.apk   — GMS-free phone APK for official F-Droid
          #   cablesnap-wear.apk     — Wear OS 4+ companion APK (Play-only)
          # The self-hosted F-Droid repo refresh keys off cablesnap.apk and
          # publishes that Play-flavor APK; the GMS-free build remains
          # available as cablesnap-fdroid.apk for official F-Droid users.
          VERSION="${{ steps.next_version.outputs.version }}"

          # BLD-2316 (IDEMPOTENT CREATE): a concurrent Scheduled Release run can
          # already have published this exact version. The workflow-level
          # `concurrency: { group: scheduled-release, cancel-in-progress: false }`
          # serializes runs, but a queued run still wakes with its own
          # `next_version` output set, so it reaches this step even though the
          # "Commit and push" step early-exited on "No staged delta after
          # regenerate — concurrent merge already shipped v$VERSION". Without
          # this guard the queued run dies on `gh release create` with "a
          # release with the same tag name already exists" (the BLD-2315 false
          # failure; run #28403940771 hit it 31 min after v0.26.47 shipped).
          #
          # In the normal bump path, an already-existing release means the
          # concurrent run published identical artifacts from the same commit —
          # treat it as a successful no-op (do NOT re-upload / duplicate assets).
          #
          # Republish mode is DELIBERATELY exempt: it already hard-errors in
          # "Compute next version" (BLD-1101) when the tag exists, so an
          # operator-driven republish whose release somehow exists must still
          # fail loudly here rather than be silently swallowed — keep republish
          # strictness intact (BLD-2316 edge-case table).
          if [ "${{ inputs.republish_current }}" != "true" ] && \
             gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::notice::Release v$VERSION already exists — a concurrent Scheduled Release run already published it. Treating as a no-op success (no duplicate assets uploaded)."
            echo "Skipped create: v$VERSION already published by a concurrent run."
            exit 0
          fi

          # BLD-3223: capture stderr and exit code so a failing create doesn't
          # bail out of `set -e` before we can classify the failure mode
          # (immutable-ghost collision vs any other error). `|| create_rc=$?`
          # neutralises the -e exit while still preserving the real rc.
          create_rc=0
          gh release create "v$VERSION" \
            cablesnap.apk \
            cablesnap-fdroid.apk \
            cablesnap-wear.apk \
            --title "v$VERSION" \
            --target main \
            --notes "$RELEASE_NOTES" 2> gh_release_create.stderr || create_rc=$?
          if [ "$create_rc" -ne 0 ]; then
            cat gh_release_create.stderr >&2
            # BLD-3223: detect GitHub Immutable-Release ghost collisions. If
            # a prior release attempt for this exact tag partially succeeded
            # (e.g. an internal 500 after the ref was reserved), GitHub keeps
            # the tag_name as a permanently-reserved immutable-release ghost.
            # The ghost is invisible to /releases, /releases/tags/... and to
            # `gh release view` (all 404), so the "Compute next version"
            # skip loop cannot pre-detect it. It only surfaces here as:
            #     HTTP 422 ... pre_receive Repository rule violations found
            #     Cannot create ref due to creations being restricted.
            #     tag_name was used by an immutable release
            # For the BUMP path, this is a recoverable class: bumping past
            # the poisoned tag on the NEXT scheduled run will succeed.
            # Emit an operator-actionable diagnostic. Republish mode is
            # DELIBERATELY exempt from soft handling — a republish colliding
            # with an existing/immutable tag is always a hard operator error
            # (BLD-1101 / BLD-2316 strictness invariant), and the more
            # obscure diagnostic below still fires plainly.
            if grep -qE 'tag_name was used by an immutable release|creations being restricted' gh_release_create.stderr; then
              echo "::error title=Immutable-release ghost blocks v$VERSION::GitHub's Immutable Releases feature is holding a permanent reservation on tag_name v$VERSION from a prior partial release attempt. The tag/release APIs return 404 for this version but the ref-creation is blocked at the pre_receive rule level, so no pre-check on the compute step can detect it."
              if [ "${{ inputs.republish_current }}" != "true" ]; then
                echo "::error::Recovery (bump path): land a commit on main that skips past v$VERSION (e.g. revert package.json / app.config.ts / fdroid metadata to the last-shipped version and re-curate '## Unreleased'), then push a lightweight placeholder tag 'v$VERSION' pointing at that commit via 'gh api -X POST repos/${{ github.repository }}/git/refs -f ref=refs/tags/v$VERSION -f sha=<merged-sha>'. The next Scheduled Release will compute the next patch and publish normally. See BLD-3223 plan doc for the reference procedure."
              else
                echo "::error::Recovery (republish path): republish for v$VERSION is impossible while the immutable-release ghost holds the tag_name. Bump past v$VERSION on the next scheduled run (see BLD-3223) — republish cannot recover this class."
              fi
            fi
            rm -f gh_release_create.stderr
            exit "$create_rc"
          fi
          rm -f gh_release_create.stderr
          echo "Released v$VERSION with phone (Play + F-Droid) and Wear OS APKs attached."
